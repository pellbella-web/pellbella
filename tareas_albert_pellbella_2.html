<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas Albert — Pellbella</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg-primary:#ffffff;--bg-secondary:#f7f6f2;--bg-tertiary:#f0efe9;
    --text-primary:#1a1a1a;--text-secondary:#6b6b68;--text-tertiary:#9e9d99;
    --border:rgba(0,0,0,0.12);--border-md:rgba(0,0,0,0.22);
    --radius-md:8px;--radius-lg:12px;
    --purple-bg:#EEEDFE;--purple-mid:#CECBF6;--purple-dark:#534AB7;--purple-darker:#3C3489;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg-primary:#1e1e1c;--bg-secondary:#2a2a28;--bg-tertiary:#242422;
      --text-primary:#f0efe9;--text-secondary:#a8a7a2;--text-tertiary:#6b6b68;
      --border:rgba(255,255,255,0.1);--border-md:rgba(255,255,255,0.2);
      --purple-bg:#26215C;--purple-mid:#3C3489;--purple-dark:#AFA9EC;--purple-darker:#CECBF6;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-tertiary);color:var(--text-primary);min-height:100vh;padding:1.5rem 1rem;}
  .container{max-width:740px;margin:0 auto;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--purple-mid);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;color:var(--purple-darker);flex-shrink:0;}
  .header-title{font-size:20px;font-weight:500;color:var(--text-primary);}
  .header-sub{font-size:13px;color:var(--text-secondary);margin-top:2px;}
  .pellbella-badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;background:var(--purple-bg);color:var(--purple-darker);border:0.5px solid var(--purple-mid);}
  .weekend-screen{text-align:center;padding:4rem 1rem;}
  .weekend-icon{font-size:48px;margin-bottom:1rem;}
  .weekend-title{font-size:22px;font-weight:500;margin-bottom:8px;}
  .weekend-sub{font-size:14px;color:var(--text-secondary);}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem;}
  .stat{background:var(--bg-primary);border-radius:var(--radius-md);padding:12px 14px;border:0.5px solid var(--border);}
  .stat-num{font-size:24px;font-weight:500;color:var(--text-primary);}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:3px;}
  .card{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type="text"]{flex:1;min-width:180px;height:36px;font-size:14px;border-radius:var(--radius-md);border:0.5px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);padding:0 12px;outline:none;}
  input[type="text"]:focus{border-color:var(--purple-dark);}
  select{height:36px;font-size:13px;border-radius:var(--radius-md);border:0.5px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);padding:0 10px;cursor:pointer;}
  .btn-add{height:36px;padding:0 18px;font-size:13px;font-weight:500;border-radius:var(--radius-md);border:0.5px solid var(--purple-dark);background:var(--purple-bg);color:var(--purple-darker);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-add:hover{background:var(--purple-mid);}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
  .filter-btn{height:28px;padding:0 12px;font-size:12px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;}
  .filter-btn.active{background:var(--purple-bg);color:var(--purple-darker);border-color:var(--purple-mid);}
  .priority-group{margin-bottom:1rem;}
  .priority-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .priority-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;}
  .p-urgente{background:#FCEBEB;color:#A32D2D;}
  .p-normal{background:#FAEEDA;color:#854F0B;}
  .task-list{display:flex;flex-direction:column;gap:5px;}
  .task{display:flex;align-items:flex-start;gap:10px;background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;transition:opacity 0.2s;}
  .task.done{opacity:0.42;}
  .task.done .task-text{text-decoration:line-through;color:var(--text-tertiary);}
  .task.delayed{border-color:#F09595;background:#FCEBEB;}
  .task.delayed .task-text{color:#791F1F;}
  .task-check{width:19px;height:19px;border-radius:50%;margin-top:1px;border:1.5px solid var(--border-md);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .task-check.checked{background:var(--purple-dark);border-color:var(--purple-dark);}
  .task-check.checked::after{content:'';display:block;width:5px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);}
  .task-cat{font-size:11px;padding:2px 8px;border-radius:10px;flex-shrink:0;margin-top:2px;}
  .cat-recepcion{background:#E6F1FB;color:#185FA5;}
  .cat-compras{background:#E1F5EE;color:#0F6E56;}
  .cat-mantenimiento{background:#FAEEDA;color:#854F0B;}
  .cat-administracion{background:#FBEAF0;color:#993556;}
  .cat-general{background:#F1EFE8;color:#5F5E5A;}
  .task-body{flex:1;}
  .task-text{font-size:14px;color:var(--text-primary);line-height:1.4;}
  .task-meta{font-size:11px;color:var(--text-tertiary);margin-top:3px;}
  .delayed-badge{font-size:10px;font-weight:500;background:#F7C1C1;color:#791F1F;padding:1px 7px;border-radius:10px;margin-left:6px;}
  .btn-del{background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:2px;display:flex;align-items:center;opacity:0.5;font-size:15px;flex-shrink:0;margin-top:1px;}
  .btn-del:hover{opacity:1;color:#A32D2D;}
  .empty{font-size:13px;color:var(--text-tertiary);padding:6px 0;}
  .separator{border:none;border-top:0.5px solid var(--border);margin:1rem 0;}
  .footer-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-secondary{height:34px;padding:0 14px;font-size:13px;border-radius:var(--radius-md);border:0.5px solid var(--border-md);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn-secondary:hover{background:var(--bg-secondary);}
  .btn-danger{height:34px;padding:0 14px;font-size:13px;border-radius:var(--radius-md);border:0.5px solid #F7C1C1;background:#FCEBEB;color:#A32D2D;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn-danger:hover{background:#F7C1C1;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--purple-darker);color:var(--purple-bg);font-size:13px;padding:10px 18px;border-radius:var(--radius-md);opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:999;}
  .toast.show{opacity:1;}
  @media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr);}.add-row{flex-direction:column;align-items:stretch;}.add-row input,.add-row select,.add-row .btn-add{width:100%;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="avatar">AL</div>
      <div>
        <div class="header-title">Tareas de Albert</div>
        <div class="header-sub" id="hdate"></div>
      </div>
    </div>
    <span class="pellbella-badge">Pellbella · Les Franqueses</span>
  </div>
  <div id="main-content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'pellbella_albert_v3';

// ── DEFINICIÓN DE TAREAS ──────────────────────────────────────────────────────
// schedule: 'daily' | 'weekly:X' (X=0lun..4vie) | 'quincenal' | 'monthly'
// Para quincenales y semanales se asigna un día fijo via weekday

const ALL_TASKS = [
  // DIARIAS RECEPCIÓN
  {id:'r01',text:'Revisar WhatsApp avisos clientes y actualizar agenda',cat:'recepcion',priority:'urgente',freq:'Cada 2h',schedule:'daily'},
  {id:'r02',text:'Revisar la agenda: sin errores, mañana y tarde',cat:'recepcion',priority:'urgente',freq:'Inicio mañana y tarde',schedule:'daily'},
  {id:'r03',text:'Revisar confirmaciones de asistencia en WhatsApp',cat:'recepcion',priority:'urgente',freq:'Inicio mañana y tarde',schedule:'daily'},
  {id:'r04',text:'Enviar WhatsApp confirmación de citas del día siguiente',cat:'recepcion',priority:'urgente',freq:'Por la mañana',schedule:'daily'},
  {id:'r05',text:'Enviar WhatsApp confirmación a nuevas clientas',cat:'recepcion',priority:'urgente',freq:'Por la mañana',schedule:'daily'},
  {id:'r06',text:'Reunión diaria con Sandra',cat:'recepcion',priority:'urgente',freq:'Diaria',schedule:'daily'},
  {id:'r07',text:'Meter captados de Bitrix en el CRM',cat:'recepcion',priority:'urgente',freq:'Diaria',schedule:'daily'},
  {id:'r08',text:'Introducir datos en Bitrix',cat:'recepcion',priority:'urgente',freq:'Diaria',schedule:'daily'},
  {id:'r09',text:'Introducir bonos y compras en el CRM',cat:'recepcion',priority:'urgente',freq:'Diaria',schedule:'daily'},
  {id:'r10',text:'Revisar bonos de las clientas agendadas',cat:'recepcion',priority:'normal',freq:'Cada 4h',schedule:'daily'},
  {id:'r11',text:'Previsión clientas con 4 sesiones para antes/después',cat:'recepcion',priority:'normal',freq:'Inicio mañana y tarde',schedule:'daily'},
  {id:'r12',text:'Control horarios esteticistas y apuntar horas extras',cat:'recepcion',priority:'normal',freq:'Diaria',schedule:'daily'},
  {id:'r13',text:'Revisión productos de cabina y reponer si necesario',cat:'recepcion',priority:'normal',freq:'Diaria',schedule:'daily'},
  {id:'r14',text:'Revisar stock de producto y consumibles',cat:'recepcion',priority:'normal',freq:'Diaria',schedule:'daily'},
  // SEMANALES FIJAS
  {id:'r15',text:'WhatsApp a leads no contactados (vídeo del anuncio)',cat:'recepcion',priority:'urgente',freq:'Jueves tarde',schedule:'weekly:3'},
  {id:'r16',text:'Reporte semanal de citas agendadas que no han acudido',cat:'recepcion',priority:'urgente',freq:'Viernes tarde',schedule:'weekly:4'},
  // MANTENIMIENTO SEMANAL — repartido lun-vie
  {id:'m01',text:'Revisar estado general de las cabinas',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:0'},
  {id:'m02',text:'Rellenar circuito de agua Crio 1',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:0'},
  {id:'m03',text:'Rellenar circuito de agua Crio 2',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:1'},
  {id:'m04',text:'Rellenar circuito de agua Crio 3',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:1'},
  {id:'m05',text:'Revisar estado Crio 1 y vaciar vasito del sistema de vacío',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:2'},
  {id:'m06',text:'Revisar estado Crio 2',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:3'},
  {id:'m07',text:'Revisar estado Crio 3 (alquiler) y vaciar vasito del sistema de vacío',cat:'mantenimiento',priority:'normal',freq:'Semanal',schedule:'weekly:4'},
  // MANTENIMIENTO QUINCENAL — semanas 1 y 3 del mes, repartido lun-vie
  {id:'q01',text:'Revisión estado equipo Sculp',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:0'},
  {id:'q02',text:'Revisión estado equipo Láser de diodo',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:0'},
  {id:'q03',text:'Revisión estado equipo Presoterapia 1',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:1'},
  {id:'q04',text:'Revisión estado equipo Presoterapia 2',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:1'},
  {id:'q05',text:'Revisión estado equipo Presoterapia 3',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:2'},
  {id:'q06',text:'Revisión estado equipo Endomodelaje',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:2'},
  {id:'q07',text:'Revisión estado equipo Cavitación',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:3'},
  {id:'q08',text:'Revisión estado equipo Rollaction',cat:'mantenimiento',priority:'normal',freq:'Quincenal',schedule:'quincenal:4'},
  // MENSUAL — primer lunes del mes
  {id:'me1',text:'Cambio de refrigerante equipo Láser de diodo',cat:'mantenimiento',priority:'normal',freq:'Mensual',schedule:'monthly:0'},
  // COMPRAS SEMANALES — 1 por día
  {id:'c01',text:'Revisión stock consumibles cabinas',cat:'compras',priority:'normal',freq:'Semanal',schedule:'weekly:0'},
  {id:'c02',text:'Revisión stock gel para cavitación',cat:'compras',priority:'normal',freq:'Semanal',schedule:'weekly:1'},
  {id:'c03',text:'Revisión stock gel para láser de diodo',cat:'compras',priority:'normal',freq:'Semanal',schedule:'weekly:2'},
  {id:'c04',text:'Revisión stock gel para crio',cat:'compras',priority:'normal',freq:'Semanal',schedule:'weekly:3'},
  {id:'c05',text:'Revisión stock de glicerol',cat:'compras',priority:'normal',freq:'Semanal',schedule:'weekly:4'},
];

// ── HELPERS DE FECHA ──────────────────────────────────────────────────────────
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getWeekday(date) {
  // JS: 0=dom,1=lun...6=sab → convertimos a 0=lun..4=vie
  const jsDay = date.getDay();
  return jsDay === 0 ? 6 : jsDay - 1; // 6=sábado, no laborable
}
function isWeekend(date) { const d = date.getDay(); return d === 0 || d === 6; }
function getWeekOfMonth(date) {
  // Semana del mes (1-based) contando por semanas naturales
  return Math.ceil(date.getDate() / 7);
}
function isQuincenalWeek(date) {
  const w = getWeekOfMonth(date); return w === 1 || w === 3;
}
function isFirstWeek(date) { return getWeekOfMonth(date) === 1; }

// ── FILTRAR TAREAS PARA HOY ───────────────────────────────────────────────────
function getTasksForDate(date) {
  if (isWeekend(date)) return [];
  const wd = getWeekday(date); // 0=lun..4=vie
  return ALL_TASKS.filter(t => {
    const s = t.schedule;
    if (s === 'daily') return true;
    if (s.startsWith('weekly:')) return parseInt(s.split(':')[1]) === wd;
    if (s.startsWith('quincenal:')) return isQuincenalWeek(date) && parseInt(s.split(':')[1]) === wd;
    if (s.startsWith('monthly:')) return isFirstWeek(date) && parseInt(s.split(':')[1]) === wd;
    return false;
  });
}

// ── ESTADO ────────────────────────────────────────────────────────────────────
function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : {};
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function getOrCreateDay(state, dateKey, tasks) {
  if (!state[dateKey]) {
    state[dateKey] = {};
    tasks.forEach(t => { state[dateKey][t.id] = {done: false, addedAt: null}; });
    saveState(state);
  }
  return state[dateKey];
}

// ── LIMPIEZA DE DÍAS VIEJOS (guardar solo últimos 14 días) ────────────────────
function pruneOldDays(state) {
  const keys = Object.keys(state).sort();
  if (keys.length > 14) {
    keys.slice(0, keys.length - 14).forEach(k => delete state[k]);
    saveState(state);
  }
}

// ── DETECTAR RETRASADAS ───────────────────────────────────────────────────────
function getDelayedTaskIds(state, todayTasks, dateKey) {
  const delayed = new Set();
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  // Buscar último día laborable anterior
  while (isWeekend(yesterday)) yesterday.setDate(yesterday.getDate() - 1);
  const ydKey = yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
  if (state[ydKey]) {
    Object.entries(state[ydKey]).forEach(([id, s]) => {
      if (!s.done) delayed.add(id);
    });
  }
  return delayed;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function formatDate(d) {
  return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}
function catLabel(c) {
  return {recepcion:'Recepción',compras:'Compras',mantenimiento:'Mantenimiento',administracion:'Administración',general:'General'}[c]||c;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let currentFilter = 'todas';
let state = {};
let todayTasks = [];
let todayKey_ = '';
let delayedIds = new Set();

function init() {
  const now = new Date();
  todayKey_ = todayKey();
  state = loadState();
  pruneOldDays(state);
  todayTasks = getTasksForDate(now);
  getOrCreateDay(state, todayKey_, todayTasks);
  delayedIds = getDelayedTaskIds(state, todayTasks, todayKey_);
  document.getElementById('hdate').textContent = formatDate(now);
  renderContent(now);
}

function renderContent(now) {
  const main = document.getElementById('main-content');
  if (isWeekend(now)) {
    main.innerHTML = `
      <div class="weekend-screen">
        <div class="weekend-icon">🌿</div>
        <div class="weekend-title">Hoy no toca trabajar</div>
        <div class="weekend-sub">Las tareas de Albert son de lunes a viernes.<br>¡Buen descanso!</div>
      </div>`;
    return;
  }
  main.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">Total hoy</div></div>
      <div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-label">Completadas</div></div>
      <div class="stat"><div class="stat-num" id="s-pend">0</div><div class="stat-label">Pendientes</div></div>
      <div class="stat"><div class="stat-num" id="s-delayed">0</div><div class="stat-label" style="color:#A32D2D">Retrasadas</div></div>
    </div>
    <div class="card">
      <div class="add-row">
        <input type="text" id="new-task" placeholder="Nueva tarea puntual..." />
        <select id="new-cat">
          <option value="recepcion">Recepción</option>
          <option value="compras">Compras</option>
          <option value="mantenimiento">Mantenimiento</option>
          <option value="administracion">Administración</option>
          <option value="general">General</option>
        </select>
        <select id="new-pri">
          <option value="urgente">🔴 Urgente</option>
          <option value="normal" selected>🟡 Normal</option>
        </select>
        <button class="btn-add" onclick="addTask()"><i class="ti ti-plus"></i> Añadir</button>
      </div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('todas',this)">Todas</button>
      <button class="filter-btn" onclick="setFilter('recepcion',this)">Recepción</button>
      <button class="filter-btn" onclick="setFilter('compras',this)">Compras</button>
      <button class="filter-btn" onclick="setFilter('mantenimiento',this)">Mantenimiento</button>
      <button class="filter-btn" onclick="setFilter('general',this)">General</button>
    </div>
    <div id="task-container"></div>
    <hr class="separator">
    <div class="footer-actions">
      <button class="btn-secondary" onclick="checkAll()"><i class="ti ti-checks"></i> Marcar todas</button>
      <button class="btn-danger" onclick="clearDone()"><i class="ti ti-trash"></i> Limpiar completadas</button>
    </div>`;
  document.getElementById('new-task').addEventListener('keydown', e => { if(e.key==='Enter') addTask(); });
  renderTasks();
}

function renderTasks() {
  if (!document.getElementById('task-container')) return;
  const dayState = state[todayKey_] || {};
  const priorities = ['urgente','normal'];
  const pLabels = {urgente:'🔴 Urgente',normal:'🟡 Normal'};
  const pClass = {urgente:'p-urgente',normal:'p-normal'};

  // Fusionar tareas del día (programadas) con extras guardadas
  const extras = (state[todayKey_+'_extras'] || []);
  const allToday = [...todayTasks, ...extras];
  const filtered = currentFilter === 'todas' ? allToday : allToday.filter(t => t.cat === currentFilter || (currentFilter==='general' && !['recepcion','compras','mantenimiento'].includes(t.cat)));

  const container = document.getElementById('task-container');
  container.innerHTML = '';
  let anyShown = false;

  priorities.forEach(pri => {
    const group = filtered.filter(t => t.priority === pri);
    if (!group.length) return;
    anyShown = true;
    const div = document.createElement('div');
    div.className = 'priority-group';
    div.innerHTML = `<div class="priority-header"><span class="priority-badge ${pClass[pri]}">${pLabels[pri]}</span><span style="font-size:12px;color:var(--text-tertiary)">${group.length} tarea(s)</span></div><div class="task-list"></div>`;
    const list = div.querySelector('.task-list');
    group.forEach(t => {
      const s = dayState[t.id] || {done:false};
      const isDelayed = delayedIds.has(t.id) && !s.done;
      const item = document.createElement('div');
      item.className = 'task' + (s.done?' done':'') + (isDelayed&&!s.done?' delayed':'');
      item.innerHTML = `
        <div class="task-check ${s.done?'checked':''}" onclick="toggleTask('${t.id}')"></div>
        <span class="task-cat cat-${t.cat}">${catLabel(t.cat)}</span>
        <div class="task-body">
          <div class="task-text">${escHtml(t.text)}${isDelayed&&!s.done?'<span class="delayed-badge">Retrasada</span>':''}</div>
          ${t.freq?`<div class="task-meta"><i class="ti ti-refresh" style="font-size:11px;vertical-align:-1px"></i> ${escHtml(t.freq)}</div>`:''}
        </div>
        ${t._extra?`<button class="btn-del" onclick="removeExtra('${t.id}')" title="Eliminar"><i class="ti ti-x"></i></button>`:''}
      `;
      list.appendChild(item);
    });
    container.appendChild(div);
  });

  if (!anyShown) container.innerHTML = '<p class="empty">No hay tareas en esta categoría.</p>';
  updateStats();
}

function updateStats() {
  const dayState = state[todayKey_] || {};
  const extras = (state[todayKey_+'_extras'] || []);
  const all = [...todayTasks, ...extras];
  const total = all.length;
  const done = all.filter(t => (dayState[t.id]||{}).done).length;
  const delayed = all.filter(t => delayedIds.has(t.id) && !(dayState[t.id]||{}).done).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-pend').textContent = total - done;
  const sd = document.getElementById('s-delayed');
  if (sd) sd.textContent = delayed;
}

function toggleTask(id) {
  if (!state[todayKey_]) state[todayKey_] = {};
  const s = state[todayKey_][id] || {done:false};
  s.done = !s.done;
  state[todayKey_][id] = s;
  saveState(state);
  renderTasks();
}

function addTask() {
  const input = document.getElementById('new-task');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const id = 'x_'+Date.now();
  const task = {id, text, cat:document.getElementById('new-cat').value, priority:document.getElementById('new-pri').value, freq:'', _extra:true};
  if (!state[todayKey_+'_extras']) state[todayKey_+'_extras'] = [];
  state[todayKey_+'_extras'].push(task);
  if (!state[todayKey_]) state[todayKey_] = {};
  state[todayKey_][id] = {done:false};
  saveState(state);
  input.value = ''; input.focus();
  renderTasks();
}

function removeExtra(id) {
  state[todayKey_+'_extras'] = (state[todayKey_+'_extras']||[]).filter(t=>t.id!==id);
  delete state[todayKey_][id];
  saveState(state);
  renderTasks();
}

function checkAll() {
  const dayState = state[todayKey_] || {};
  const extras = (state[todayKey_+'_extras']||[]);
  [...todayTasks,...extras].forEach(t => { dayState[t.id] = {done:true}; });
  state[todayKey_] = dayState;
  saveState(state);
  renderTasks();
  showToast('Todas las tareas completadas');
}

function clearDone() {
  const dayState = state[todayKey_] || {};
  const done = Object.entries(dayState).filter(([,s])=>s.done).map(([id])=>id);
  // Solo eliminar extras completadas; las programadas se quedan (sólo se desmarcan visualmente)
  state[todayKey_+'_extras'] = (state[todayKey_+'_extras']||[]).filter(t=>!done.includes(t.id));
  done.forEach(id => { dayState[id] = {done:true}; }); // mantener como hecho
  saveState(state);
  renderTasks();
  showToast(`${done.length} tarea(s) completadas ocultadas`);
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

init();
</script>
</body>
</html>
