<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleprompter karaoke</title>
<style>
  :root { --accent:#ffd36b; --dim:rgba(255,255,255,.28); --past:rgba(255,255,255,.14); --fs:44px; --anchor:28%; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #stage.mirror #track { transform-origin:center; }
  #track { position:absolute; left:0; right:0; top:0; padding:0 6vw; transition:transform .55s cubic-bezier(.2,.7,.2,1); will-change:transform; }
  .line { font-size:var(--fs); line-height:1.25; font-weight:600; text-align:center; padding:.28em 0; color:var(--dim); transition:color .3s, opacity .3s, transform .3s; }
  .line.past { color:var(--past); }
  .line.cur { color:#fff; transform:scale(1.04); }
  .line.gap { height:.8em; padding:0; }
  .line.title { font-size:calc(var(--fs)*.55); letter-spacing:.18em; font-weight:500; text-transform:uppercase; }
  .w { transition:color .15s; }
  .line.cur .w.on { color:var(--accent); }
  #guide { position:fixed; left:0; right:0; top:var(--anchor); height:0; pointer-events:none; }
  #guide::before, #guide::after { content:""; position:absolute; top:-2px; width:18px; height:4px; background:var(--accent); opacity:.7; border-radius:2px; }
  #guide::before { left:8px; } #guide::after { right:8px; }
  #count { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:30vmin; font-weight:700; color:var(--accent); background:rgba(0,0,0,.6); }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.92) 30%); display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:center; transition:opacity .4s; font-size:14px; }
  body.playing #bar { opacity:0; pointer-events:none; }
  body.playing.showbar #bar { opacity:1; pointer-events:auto; }
  button { background:#1d1d1d; color:#fff; border:1px solid #333; border-radius:10px; padding:10px 14px; font-size:15px; cursor:pointer; }
  button.main { background:var(--accent); color:#000; border:none; font-weight:700; min-width:120px; }
  button.on { border-color:var(--accent); color:var(--accent); }
  label { display:flex; align-items:center; gap:8px; color:#bbb; }
  input[type=range] { width:120px; accent-color:var(--accent); }
  .val { color:#fff; min-width:3.5em; display:inline-block; }
  #progress { position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; transition:width .3s; }
  #help { position:fixed; top:8px; right:12px; color:#666; font-size:12px; }
  body.playing #help { display:none; }

  #editor { position:fixed; inset:0; background:#0b0b0b; display:flex; flex-direction:column; align-items:center; padding:24px 16px calc(24px + env(safe-area-inset-bottom)); gap:14px; z-index:10; }
  #editor h1 { margin:0; font-size:22px; font-weight:600; }
  #editor p { margin:0; color:#999; font-size:14px; text-align:center; }
  #txt { width:min(900px,100%); flex:1; background:#151515; color:#fff; border:1px solid #333; border-radius:12px; padding:16px; font-size:17px; line-height:1.5; resize:none; font-family:inherit; user-select:text; -webkit-user-select:text; }
  #txt:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center; }
  body.editing #bar, body.editing #help, body.editing #guide, body.editing #progress { display:none; }
</style>
</head>
<body>
<div id="editor">
  <h1>Teleprompter karaoke</h1>
  <p>Pega aquí el texto que vas a leer. Se ordena solo en frases cortas.</p>
  <textarea id="txt" placeholder="Pega tu guion aquí…"></textarea>
  <div class="row">
    <label><input type="checkbox" id="keep"> Respetar mis saltos de línea tal cual</label>
    <button id="clear">Borrar</button>
    <button id="load" class="main">Preparar ▶</button>
  </div>
</div>
<div id="progress"></div>
<div id="help">Espacio: play/pausa · ←/→: frase · Toca izquierda/derecha para saltar</div>
<div id="stage"><div id="track"></div></div>
<div id="guide"></div>
<div id="count"></div>

<div id="bar">
  <button id="edit">✎ Texto</button>
  <button id="restart">⟲ Inicio</button>
  <button id="prev">◀</button>
  <button id="play" class="main">▶ Empezar</button>
  <button id="next">▶</button>
  <label>Ritmo <input id="sps" type="range" min="3.5" max="8" step="0.1" value="6.3"><span class="val" id="spsV"></span></label>
  <label>Pausas <input id="pz" type="range" min="0.3" max="2" step="0.1" value="1"><span class="val" id="pzV"></span></label>
  <label>Letra <input id="fs" type="range" min="24" max="90" step="2" value="44"><span class="val" id="fsV"></span></label>
  <label>Altura <input id="anc" type="range" min="12" max="55" step="1" value="28"><span class="val" id="ancV"></span></label>
  <button id="mirror">Espejo</button>
  <button id="auto" class="on">Auto</button>
  <button id="fullscreen">⛶</button>
</div>

<script>
const track = document.getElementById('track');
let lines = [];
const SENT_END = /[.!?…:;»"]$/;

function chunkSentence(s) {
  const words = s.split(/\s+/).filter(Boolean);
  if (words.length <= 9) return [s];
  // split at commas first
  const parts = []; let cur = [];
  words.forEach((w, i) => {
    cur.push(w);
    if (/[,]$/.test(w) && cur.length >= 3 && words.length - i - 1 >= 2) { parts.push(cur); cur = []; }
  });
  if (cur.length) parts.push(cur);
  const out = [];
  parts.forEach(p => {
    if (p.length <= 10) { out.push(p.join(' ')); return; }
    const BRK = /^(y|e|o|que|porque|pero|para|por|cuando|como|con|sin|de|del|en|antes|después|aunque|si|ni|la|el|los|las|a)$/i;
    let rest = p.slice();
    while (rest.length > 10) {
      const n = Math.ceil(rest.length / 8), target = Math.ceil(rest.length / n);
      let best = target, bestScore = -1;
      for (let k = Math.max(3, target - 3); k <= Math.min(rest.length - 3, target + 2); k++) {
        const score = (/[,;]$/.test(rest[k-1]) ? 3 : 0) + (BRK.test(rest[k]) ? 2 : 0) - (BRK.test(rest[k-1]) ? 3 : 0) - Math.abs(k - target) * 0.3;
        if (score > bestScore) { bestScore = score; best = k; }
      }
      out.push(rest.slice(0, best).join(' ')); rest = rest.slice(best);
    }
    out.push(rest.join(' '));
  });
  return out;
}

function arrange(text, keep) {
  const raw = text.replace(/\r/g, '').split('\n').map(l => l.trim());
  if (keep) return raw;
  // join hard-wrapped lines into paragraphs
  const paras = []; let buf = '';
  raw.forEach(l => {
    if (!l) { if (buf) { paras.push(buf); buf = ''; } paras.push(''); return; }
    buf = buf ? buf + ' ' + l : l;
    const shortList = /,$/.test(l) && l.split(/\s+/).length <= 7;
    if (SENT_END.test(l) || shortList) { paras.push(buf); buf = ''; }
  });
  if (buf) paras.push(buf);
  const out = [];
  paras.forEach(p => {
    if (!p) { if (out.length && out[out.length - 1] !== '') out.push(''); return; }
    const sentences = p.match(/[^.!?…]+[.!?…]+["»]?|[^.!?…]+$/g) || [p];
    sentences.map(x => x.trim()).filter(Boolean).forEach(x => chunkSentence(x).forEach(c => out.push(c)));
  });
  while (out.length && out[out.length - 1] === '') out.pop();
  return out;
}

function build(text, keep) {
  track.innerHTML = ''; lines = [];
  const arr = arrange(text, keep);
  arr.forEach((t, i) => {
    const d = document.createElement('div');
    if (!t.trim()) { d.className = 'line gap'; track.appendChild(d); return; }
    d.className = 'line';
    const words = [];
    t.split(/(\s+)/).forEach(p => {
      if (!p) return;
      if (/^\s+$/.test(p)) { d.appendChild(document.createTextNode(p)); return; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = p;
      d.appendChild(s); words.push(s);
    });
    track.appendChild(d);
    const idx = lines.length;
    d.addEventListener('click', e => { e.stopPropagation(); go(idx); });
    lines.push({ el:d, words, endsPara: !(arr[i+1] || '').trim() || /[.!?…:]$/.test(t.trim()) });
  });
}

let cur = 0, playing = false, auto = true, timer = null, wordTimers = [], lineStart = 0;
const $ = id => document.getElementById(id);
const settings = { sps:6.3, pz:1, fs:44, anc:28, mirror:false };
try { Object.assign(settings, JSON.parse(localStorage.getItem('tp-settings2') || '{}')); } catch(e) {}
function save(){ try { localStorage.setItem('tp-settings2', JSON.stringify(settings)); } catch(e) {} }

function applySettings() {
  $('sps').value = settings.sps; $('spsV').textContent = settings.sps < 5 ? 'Pausado' : settings.sps < 5.5 ? 'Tranquilo' : settings.sps <= 6.8 ? 'Natural' : settings.sps <= 7.4 ? 'Ágil' : 'Rápido';
  $('pz').value = settings.pz; $('pzV').textContent = '×' + settings.pz.toFixed(1);
  $('fs').value = settings.fs; $('fsV').textContent = settings.fs + ' px';
  $('anc').value = settings.anc; $('ancV').textContent = settings.anc + ' %';
  document.documentElement.style.setProperty('--fs', settings.fs + 'px');
  document.documentElement.style.setProperty('--anchor', settings.anc + '%');
  $('mirror').classList.toggle('on', settings.mirror);
  $('stage').style.transform = settings.mirror ? 'scaleX(-1)' : '';
  position();
}

function position() {
  if (!lines.length) return;
  const l = lines[cur].el;
  const anchorY = window.innerHeight * settings.anc / 100;
  const y = anchorY - (l.offsetTop + l.offsetHeight / 2);
  track.style.transform = `translateY(${y}px)`;
  $('progress').style.width = (lines.length > 1 ? cur / (lines.length - 1) * 100 : 0) + '%';
}

function clearTimers(){ clearTimeout(timer); wordTimers.forEach(clearTimeout); wordTimers = []; }

function render() {
  lines.forEach((l, i) => {
    l.el.classList.toggle('cur', i === cur);
    l.el.classList.toggle('past', i < cur);
    l.words.forEach(w => w.classList.remove('on'));
  });
  position();
}

// ---- Ritmo natural: tiempo por sílaba + pausas según puntuación ----
const UNITS = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
function syllables(word) {
  let w = word.toLowerCase();
  let extra = 0;
  if (/€/.test(w)) extra += 2;          // "euros"
  if (/%/.test(w)) extra += 4;          // "por ciento"
  const digits = (w.match(/\d/g) || []).length;
  if (digits) extra += digits * 2.6;    // "ciento cincuenta y cinco"...
  w = w.replace(/[^a-záéíóúüñ]/g, '');
  const groups = (w.match(/[aeiouáéíóúü]+/g) || []);
  let n = groups.reduce((a, g) => a + (g.length >= 2 && /[aeoáéó]{2}/.test(g) ? 2 : 1), 0);
  return Math.max(n + extra, w || digits ? 1 : 0);
}
function pauseAfter(word, isLast) {
  // segundos de pausa natural tras la palabra
  let p = 0;
  if (/(\.\.\.|…)["»]?$/.test(word)) p = 0.85;
  else if (/[.!?]["»]?$/.test(word)) p = 0.6;
  else if (/:$/.test(word)) p = 0.45;
  else if (/;$/.test(word)) p = 0.4;
  else if (/,$/.test(word)) p = 0.28;
  else if (isLast) p = 0.08;             // respiro mínimo al cambiar de línea sin puntuación
  return p * settings.pz;
}
function schedule(l) {
  // devuelve [inicio de cada palabra en ms, duración total en ms]
  const perSyl = 1000 / settings.sps;
  let t = 0; const starts = [];
  l.words.forEach((w, k) => {
    starts.push(t);
    const txt = w.textContent;
    t += syllables(txt) * perSyl + 40;           // pequeña transición entre palabras
    t += pauseAfter(txt, k === l.words.length - 1) * 1000;
  });
  return [starts, t];
}

function runLine() {
  clearTimers();
  const l = lines[cur];
  const [starts, total] = schedule(l);
  l.words.forEach((w, k) => wordTimers.push(setTimeout(() => w.classList.add('on'), starts[k])));
  if (auto) {
    const extra = (l.endsPara && !/[.!?…:]$/.test(l.el.textContent.trim()) ? 0.35 : 0) * settings.pz * 1000
                + (!(lines[cur+1]) ? 0 : (l.el.nextElementSibling && l.el.nextElementSibling.classList.contains('gap') ? 0.4 * settings.pz * 1000 : 0));
    timer = setTimeout(() => {
      if (cur < lines.length - 1) { cur++; render(); runLine(); }
      else stop(true);
    }, total + extra);
  }
}

function go(i) {
  cur = Math.max(0, Math.min(lines.length - 1, i));
  render();
  if (playing) runLine();
}

function countdown(cb) {
  const c = $('count'); let n = 3; c.style.display = 'flex'; c.textContent = n;
  const t = setInterval(() => { n--; if (n === 0) { clearInterval(t); c.style.display = 'none'; cb(); } else c.textContent = n; }, 800);
}

function start() {
  if (playing) return;
  const begin = () => { playing = true; document.body.classList.add('playing'); $('play').textContent = '❚❚ Pausa'; runLine(); };
  if (cur === 0) countdown(begin); else begin();
}
function stop(done) {
  playing = false; clearTimers(); document.body.classList.remove('playing', 'showbar');
  $('play').textContent = done ? '▶ Otra toma' : '▶ Seguir';
  if (done) lines[cur].words.forEach(w => w.classList.add('on'));
}
function toggle(){ if (!lines.length) return; if (playing) stop(); else { if ($('play').textContent.includes('Otra')) { cur = 0; render(); } start(); } }

$('play').onclick = e => { e.stopPropagation(); toggle(); };
$('prev').onclick = e => { e.stopPropagation(); go(cur - 1); };
$('next').onclick = e => { e.stopPropagation(); go(cur + 1); };
$('restart').onclick = e => { e.stopPropagation(); stop(); cur = 0; render(); $('play').textContent = '▶ Empezar'; };
$('mirror').onclick = e => { e.stopPropagation(); settings.mirror = !settings.mirror; save(); applySettings(); };
$('auto').onclick = e => { e.stopPropagation(); auto = !auto; $('auto').classList.toggle('on', auto); if (playing) runLine(); };
$('fullscreen').onclick = e => { e.stopPropagation(); try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); } catch(_){} };
[['sps','sps'],['pz','pz'],['fs','fs'],['anc','anc']].forEach(([id,k]) => {
  $(id).oninput = e => { settings[k] = parseFloat(e.target.value); save(); applySettings(); };
  $(id).onclick = e => e.stopPropagation();
});
$('bar').addEventListener('click', e => e.stopPropagation());

// tap zones: left third back, right third forward, middle play/pause
document.getElementById('stage').addEventListener('click', e => {
  const x = e.clientX / window.innerWidth;
  const xx = settings.mirror ? 1 - x : x;
  if (xx < .3) go(cur - 1); else if (xx > .7) go(cur + 1); else toggle();
});
// show bar briefly on mouse move while playing
let hideT; document.addEventListener('mousemove', () => { if (!playing) return; document.body.classList.add('showbar'); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove('showbar'), 1800); });

document.addEventListener('keydown', e => {
  if (document.body.classList.contains('editing')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1);
  else if (e.key === '+') { settings.sps = Math.min(8, +(settings.sps + 0.2).toFixed(1)); save(); applySettings(); }
  else if (e.key === '-') { settings.sps = Math.max(3.5, +(settings.sps - 0.2).toFixed(1)); save(); applySettings(); }
  else if (e.key.toLowerCase() === 'm') { settings.mirror = !settings.mirror; save(); applySettings(); }
  else if (e.key.toLowerCase() === 'r') $('restart').click();
});
window.addEventListener('resize', position);

const txt = $('txt'), keep = $('keep');
try { txt.value = localStorage.getItem('tp-text') || ''; keep.checked = localStorage.getItem('tp-keep') === '1'; } catch(e) {}
function openEditor() { stop(); document.body.classList.add('editing'); $('editor').style.display = 'flex'; setTimeout(() => txt.focus(), 50); }
function closeEditor() {
  const t = txt.value.trim();
  if (!t) { txt.focus(); txt.placeholder = 'Primero pega un texto aquí…'; return; }
  try { localStorage.setItem('tp-text', txt.value); localStorage.setItem('tp-keep', keep.checked ? '1' : '0'); } catch(e) {}
  build(txt.value, keep.checked);
  $('editor').style.display = 'none'; document.body.classList.remove('editing');
  cur = 0; $('play').textContent = '▶ Empezar'; applySettings(); render();
}
$('load').onclick = closeEditor;
$('clear').onclick = () => { txt.value = ''; txt.focus(); };
$('edit').onclick = e => { e.stopPropagation(); openEditor(); };
txt.addEventListener('keydown', e => { e.stopPropagation(); if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') closeEditor(); });
applySettings();
openEditor();
</script>
</body>
</html>
