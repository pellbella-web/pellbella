<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Diagnóstico Pellbella</title>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
.pw{max-width:680px;margin:0 auto;padding:1.5rem 1rem;font-family:var(--font-sans);}
.ph{text-align:center;margin-bottom:2rem;}
.plogo{font-size:28px;font-weight:500;color:var(--color-text-primary);letter-spacing:2px;}
.psub{font-size:13px;color:var(--color-text-secondary);margin-top:4px;}
.pprog{height:4px;background:var(--color-border-tertiary);border-radius:2px;margin-bottom:2rem;}
.pprogb{height:4px;background:#B4B2A9;border-radius:2px;transition:width 0.4s;}
.pstep{display:none;}.pstep.active{display:block;}
.pqcat{font-size:12px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.75rem;}
.pq{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.5rem;line-height:1.4;}
.popts{display:flex;flex-direction:column;gap:10px;margin-top:1.25rem;}
.popt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);cursor:pointer;background:var(--color-background-primary);}
.popt:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary);}
.popt.selected{border-color:var(--color-border-primary);background:var(--color-background-secondary);}
.poc{width:20px;height:20px;border-radius:50%;border:0.5px solid var(--color-border-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.popt.selected .poc{background:var(--color-text-primary);border-color:var(--color-text-primary);}
.pod{width:8px;height:8px;border-radius:50%;background:var(--color-background-primary);display:none;}
.popt.selected .pod{display:block;}
.potxt{font-size:15px;color:var(--color-text-primary);line-height:1.4;}
.posub{font-size:12px;color:var(--color-text-secondary);margin-top:2px;}
.pmhint{font-size:12px;color:var(--color-text-secondary);margin-top:0.75rem;}
.pnav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;}
.pbtn{padding:12px 28px;border-radius:var(--border-radius-md);font-size:15px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);}
.pbtn:hover{background:var(--color-background-secondary);}
.pbtn-p{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
.pbtn-p:hover{opacity:0.85;}
.pbtn:disabled{opacity:0.3;cursor:not-allowed;}
.psc{font-size:13px;color:var(--color-text-secondary);}
.pinput{width:100%;padding:12px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:15px;margin-top:1rem;background:var(--color-background-primary);color:var(--color-text-primary);}
.pinput:focus{outline:none;border-color:var(--color-border-primary);}
.slider-group{margin-top:1.5rem;}
.slider-item{margin-bottom:1.75rem;}
.slider-label{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.25rem;}
.slider-desc{font-size:12px;color:var(--color-text-secondary);margin-bottom:0.75rem;line-height:1.5;}
.slider-row{display:flex;align-items:center;gap:12px;}
.sl{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--color-border-tertiary);border-radius:2px;outline:none;cursor:pointer;}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--color-text-primary);cursor:pointer;border:none;}
.sl::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--color-text-primary);cursor:pointer;border:none;}
.sl-val{font-size:16px;font-weight:500;color:var(--color-text-primary);min-width:20px;text-align:center;}
.sl-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-secondary);margin-top:4px;}
.vol-display{text-align:center;margin-top:1.25rem;padding:1.25rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-secondary);}
.vol-num{font-size:32px;font-weight:500;color:var(--color-text-primary);line-height:1;}
.vol-unit{font-size:14px;color:var(--color-text-secondary);margin-top:4px;}
.vol-desc{font-size:13px;color:var(--color-text-secondary);margin-top:8px;line-height:1.5;}
.vol-sessions{margin-top:10px;font-size:13px;font-weight:500;color:var(--color-text-primary);}
.vol-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:0.5rem;}
.vol-slider{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:var(--color-border-tertiary);border-radius:2px;outline:none;cursor:pointer;}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--color-text-primary);cursor:pointer;border:none;}
.vol-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--color-text-primary);cursor:pointer;border:none;}
.return-screen{text-align:center;padding:3rem 1rem;}
.return-icon{font-size:48px;margin-bottom:1.5rem;color:var(--color-text-secondary);}
.return-title{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.75rem;}
.return-sub{font-size:15px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:2rem;}
.pin-section{margin-top:1.5rem;}
.pin-label{font-size:13px;color:var(--color-text-secondary);margin-bottom:0.75rem;}
.pin-input{display:flex;gap:8px;justify-content:center;}
.pin-digit{width:52px;height:60px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:24px;font-weight:500;text-align:center;background:var(--color-background-primary);color:var(--color-text-primary);}
.pin-digit:focus{outline:none;border-color:var(--color-border-primary);}
.pin-err{font-size:13px;color:var(--color-text-secondary);margin-top:0.75rem;min-height:20px;text-align:center;}
.result-screen{display:none;}
.result-screen.active{display:block;}
.rh{text-align:center;margin-bottom:2rem;}
.rh-title{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.5rem;}
.rh-sub{font-size:14px;color:var(--color-text-secondary);}
.rcard{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem;background:var(--color-background-primary);}
.rcard.featured{border:2px solid var(--color-border-primary);}
.rsect{font-size:13px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem;}
.rbadge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;background:var(--color-background-secondary);color:var(--color-text-secondary);margin-bottom:0.75rem;}
.rcard.featured .rbadge{background:var(--color-text-primary);color:var(--color-background-primary);}
.rname{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.5rem;}
.rinc{font-size:13px;color:var(--color-text-secondary);margin-bottom:0.75rem;line-height:1.6;}
.rsci{font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-left:2px solid var(--color-border-secondary);padding:10px 14px;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;margin-bottom:0.75rem;line-height:1.6;}
.rsci-lbl{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.rprice{font-size:20px;font-weight:500;color:var(--color-text-primary);}
.rpricesub{font-size:12px;color:var(--color-text-secondary);margin-top:2px;}
.rdiv{height:0.5px;background:var(--color-border-tertiary);margin:1.5rem 0;}
.rnote{font-size:13px;color:var(--color-text-secondary);text-align:center;margin-top:1.5rem;line-height:1.6;}
.pill{display:inline-flex;padding:4px 12px;border-radius:20px;font-size:13px;background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary);margin:3px;}
.pill.hl{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.5rem;}
.motivation-box{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1.5rem;background:var(--color-background-secondary);}
.motivation-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
.motivation-label{font-size:13px;color:var(--color-text-secondary);}
.motivation-val{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.motivation-bar{height:6px;background:var(--color-border-tertiary);border-radius:3px;margin-bottom:1rem;}
.motivation-fill{height:6px;background:var(--color-text-primary);border-radius:3px;}
.chat-section{margin-top:1.5rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;}
.chat-header{padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);}
.chat-title{font-size:14px;font-weight:500;color:var(--color-text-primary);}
.chat-sub{font-size:12px;color:var(--color-text-secondary);margin-top:2px;}
.chat-messages{padding:16px;min-height:180px;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:var(--border-radius-lg);font-size:14px;line-height:1.5;}
.chat-msg.bot{background:var(--color-background-secondary);color:var(--color-text-primary);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-msg.user{background:var(--color-text-primary);color:var(--color-background-primary);align-self:flex-end;border-bottom-right-radius:4px;}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:0.5px solid var(--color-border-tertiary);}
.chat-input{flex:1;padding:10px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:14px;background:var(--color-background-primary);color:var(--color-text-primary);}
.chat-input:focus{outline:none;border-color:var(--color-border-primary);}
.chat-send{padding:10px 16px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-text-primary);color:var(--color-background-primary);cursor:pointer;font-size:14px;}
.lang-btn{padding:6px 16px;border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);}
.lang-btn.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);}
.plang{display:flex;gap:8px;justify-content:center;margin-bottom:1.5rem;}
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border-bottom-left-radius:4px;align-self:flex-start;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--color-text-secondary);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0;}40%{opacity:1;}}
</style>

<div class="pw">
  <div class="plang">
    <button class="lang-btn active" onclick="setLang('es',event)">Castellano</button>
    <button class="lang-btn" onclick="setLang('ca',event)">Català</button>
  </div>
  <div class="ph">
    <div class="plogo">pb</div>
    <div class="psub" id="lbl-sub">Diagnóstico personalizado · Primera visita</div>
  </div>
  <div class="pprog"><div class="pprogb" id="prog" style="width:0%"></div></div>
  <div id="steps-wrap"></div>
  <div id="return-wrap" style="display:none"></div>
  <div class="result-screen" id="result-wrap"></div>
</div>

<script>
const PIN='1234';
const SCIENCE={
  criox:{es:'La criolipólisis aplica frío controlado (-5°C a -10°C) que induce apoptosis selectiva de los adipocitos sin dañar tejidos circundantes. El cuerpo elimina las células destruidas en 4-12 semanas a través del sistema linfático, con una reducción demostrada de hasta el 25% del tejido graso por zona tratada. La respuesta es acumulativa: a mayor número de sesiones, mayor volumen de adipocitos eliminados.',ca:'La criolipòlisi aplica fred controlat que indueix apoptosi selectiva dels adipòcits. El cos elimina les cèl·lules destruïdes en 4-12 setmanes a través del sistema limfàtic, amb una reducció de fins al 25% del teixit gras per zona. La resposta és acumulativa: a major nombre de sessions, major volum eliminat.'},
  endo:{es:'La vacumterapia genera un vacío mecánico que descomprime estructuras vasculares y linfáticas colapsadas —causa principal de la celulitis— restaurando la microcirculación. El movimiento multidireccional del cabezal estimula fibroblastos y favorece la síntesis de colágeno, elastina y ácido hialurónico, con resultados visibles desde la primera sesión.',ca:'La vacumteràpia genera un buit mecànic que descomprimeix estructures vasculars i limfàtiques col·lapsades —causa principal de la cel·lulitis— restaurant la microcirculació. Estimula fibroblasts i afavoreix la síntesi de col·lagen, elastina i àcid hialurònic.'},
  ems:{es:'La EMS genera contracciones musculares supramaximales mediante impulsos eléctricos directos a las fibras musculares —hasta 36.000 contracciones en 30 minutos— equivalentes a horas de ejercicio intenso. Aumenta la masa muscular, mejora el tono y el metabolismo basal con efectos visibles en 4-6 semanas.',ca:"L'EMS genera contraccions musculars supramaximals mitjançant impulsos elèctrics directes —fins a 36.000 contraccions en 30 minuts. Augmenta la massa muscular, millora el to i el metabolisme basal."},
  rfcorp:{es:'La radiofrecuencia corporal genera calor interno a 40-45°C que activa fibroblastos e incrementa la síntesis de colágeno tipo I y III, mejorando elasticidad y firmeza. Especialmente eficaz para reafirmar la piel tras la pérdida de volumen.',ca:'La radiofreqüència corporal genera calor intern a 40-45°C que activa fibroblasts i incrementa la síntesi de col·lagen tipus I i III. Especialment eficaç per reafirmar la pell.'},
  rffac:{es:'La radiofrecuencia capacitiva facial calienta la dermis a 40-42°C produciendo contracción inmediata de fibras de colágeno —efecto tensor visible al instante— y estimulando la neocolagénesis. Potencia la absorción de activos biológicos hasta un 40% más.',ca:"La radiofreqüència capacitiva facial escalfa la dermis a 40-42°C produint contracció immediata de fibres de col·lagen i estimulant la neocol·lagenogènesi. Potencia l'absorció d'actius biològics fins a un 40% més."},
  plasma:{es:'El plasma pen sublima con precisión el tejido superficial en el punto exacto sin afectar tejido circundante, provocando microcoagulación controlada que elimina lesiones pigmentadas y estimula la regeneración celular.',ca:'El plasma pen sublima amb precisió el teixit superficial en el punt exacte, provocant microcoagulació controlada que elimina lesions pigmentades i estimula la regeneració cel·lular.'},
  lipoled:{es:'La luz LED activa la circulación microvascular, estimula la producción de ATP celular y favorece la síntesis de colágeno en la dermis, con resultado de luminosidad inmediata y efecto acumulativo.',ca:"La llum LED activa la circulació microvascular, estimula la producció d'ATP cel·lular i afavoreix la síntesi de col·lagen, amb lluminositat immediata i efecte acumulatiu."},
  cavi:{es:'Los ultrasonidos de baja frecuencia (40 kHz) generan microburbujas que destruyen selectivamente las membranas de los adipocitos en piernas y brazos. Indicada exclusivamente en zonas de tejido blando accesible.',ca:'Els ultrasons de baixa freqüència (40 kHz) generen microbombolles que destrueixen selectivament les membranes dels adipòcits a cames i braços.'}
};

let lang='es',answers={vol_objetivo:1,motiv_necesidad:3,motiv_importancia:3,motiv_urgencia:3},step=0,aq=[],chatMsgs=[];

function getCrioSessions(v){
  const map={1:6,2:8,3:10,4:12};
  return map[Math.min(v,4)]||6;
}

function getCrioPrice(n,l){
  if(n<=6) return {pack:l==='es'?'Pack 2 sesiones (campaña): 118 €':'Pack 2 sessions (campanya): 118 €',detail:l==='es'?'+ Pack 4+1 de regalo: 236 €':'+ Pack 4+1 de regal: 236 €'};
  if(n<=8) return {pack:l==='es'?'Pack 4+1 de regalo × 2: 472 €':'Pack 4+1 de regal × 2: 472 €',detail:l==='es'?'56,80 €/sesión':'56,80 €/sessió'};
  return {pack:l==='es'?'Pack intensivo 12 sesiones: 900 €':'Pack intensiu 12 sessions: 900 €',detail:l==='es'?'75 €/sesión':'75 €/sessió'};
}

function setLang(l,e){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('lbl-sub').textContent=L[lang].sub;
  answers={vol_objetivo:1,motiv_necesidad:3,motiv_importancia:3,motiv_urgencia:3};
  step=0; chatMsgs=[];
  document.getElementById('return-wrap').style.display='none';
  document.getElementById('result-wrap').classList.remove('active');
  document.getElementById('result-wrap').style.display='none';
  document.getElementById('steps-wrap').style.display='block';
  render();
}

function getAQ(){return L[lang].questions.filter(q=>!q.condition||q.condition(answers));}

function buildSteps(){
  aq=getAQ();
  const c=document.getElementById('steps-wrap');c.innerHTML='';
  aq.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='pstep'+(i===step?' active':'');
    d.innerHTML=buildHTML(q,i);c.appendChild(d);
  });
}

function buildHTML(q,i){
  const t=L[lang];let h='';
  if(q.type==='text'){
    h=`<input class="pinput" type="text" placeholder="${q.ph}" value="${answers[q.id]||''}" oninput="answers['${q.id}']=this.value;upNav()"/>`;
  } else if(q.type==='slider_vol'){
    const v=answers.vol_objetivo||1;
    const descs=t.volDescs;
    h=`<div style="margin-top:1.5rem">
      <div class="vol-labels"><span>1</span><span>2</span><span>3</span><span>4</span></div>
      <input type="range" class="vol-slider" min="1" max="4" step="1" value="${v}" oninput="updVol(this.value)"/>
      <div class="vol-display">
        <div class="vol-num" id="vnum">${v}</div>
        <div class="vol-unit">${t.volUnit}</div>
        <div class="vol-desc" id="vdesc">${descs[v-1]}</div>
        <div class="vol-sessions" id="vsess">${t.volSess(getCrioSessions(v))}</div>
      </div>
    </div>`;
  } else if(q.type==='slider_motiv'){
    const t2=L[lang];
    const motivKeys=[
      {k:'necesidad', num:1},
      {k:'importancia', num:2},
      {k:'urgencia', num:3}
    ];
    h='<div class="slider-group">';
    motivKeys.forEach(function(mk){
      var k=mk.k, num=mk.num;
      var label=t2['motiv'+num]||'';
      var desc=t2['motiv'+num+'desc']||'';
      var val=answers['motiv_'+k]||3;
      h+='<div class="slider-item">';
      h+='<div class="slider-label">'+label+'</div>';
      h+='<div class="slider-desc">'+desc+'</div>';
      h+='<div class="slider-row">';
      h+='<span style="font-size:12px;color:var(--color-text-secondary)">'+t2.motivLow+'</span>';
      h+='<input type="range" class="sl" min="1" max="5" step="1" value="'+val+'" oninput="answers[\'motiv_'+k+'\']=parseInt(this.value);document.getElementById(\'mv_'+k+'\').textContent=this.value"/>';
      h+='<span class="sl-val" id="mv_'+k+'">'+val+'</span>';
      h+='<span style="font-size:12px;color:var(--color-text-secondary)">'+t2.motivHigh+'</span>';
      h+='</div>';
      h+='<div class="sl-labels"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>';
      h+='</div>';
    });
    h+='</div>';
  } else {
    const isM=q.type==='multi',sel=answers[q.id]||(isM?[]:null);
    h='<div class="popts">';
    (q.opts||[]).forEach(o=>{
      const s=isM?sel.includes(o.val):sel===o.val;
      h+=`<div class="popt${s?' selected':''}" onclick="selOpt('${q.id}','${o.val}',${isM})">
        <div class="poc"><div class="pod"></div></div>
        <div><div class="potxt">${o.label}</div>${o.sub?`<div class="posub">${o.sub}</div>`:''}</div>
      </div>`;
    });
    h+='</div>';
    if(isM)h+=`<div class="pmhint">${t.multiHint}</div>`;
  }
  const total=aq.length,isLast=i===total-1;
  return `<div class="pqcat">${q.cat}</div>
    <div class="pq">${q.q}</div>${h}
    <div class="pnav">
      <button class="pbtn" onclick="goBack()" ${i===0?'style="visibility:hidden"':''}>${t.prev}</button>
      <span class="psc">${t.stepOf(i+1,total)}</span>
      <button class="pbtn pbtn-p" id="bn${i}" onclick="${isLast?'showReturn()':'goNext()'}" ${!canGo(q)?'disabled':''}>${isLast?t.finish:t.next}</button>
    </div>`;
}

function updVol(v){
  answers.vol_objetivo=parseInt(v);
  const t=L[lang];
  const vn=document.getElementById('vnum');if(vn)vn.textContent=v;
  const vd=document.getElementById('vdesc');if(vd)vd.textContent=t.volDescs[v-1];
  const vs=document.getElementById('vsess');if(vs)vs.textContent=t.volSess(getCrioSessions(parseInt(v)));
}

function canGo(q){
  if(q.type==='slider_vol'||q.type==='slider_motiv')return true;
  if(q.type==='text')return(answers[q.id]||'').trim().length>0;
  if(q.type==='multi')return(answers[q.id]||[]).length>0;
  return answers[q.id]!=null;
}
function upNav(){const q=aq[step];const b=document.getElementById('bn'+step);if(b)b.disabled=!canGo(q);}
function selOpt(id,val,isM){
  if(isM){if(!answers[id])answers[id]=[];const x=answers[id].indexOf(val);if(x>=0)answers[id].splice(x,1);else answers[id].push(val);}
  else answers[id]=val;
  buildSteps();showStep(step);updProg();
}
function goNext(){aq=getAQ();if(step<aq.length-1){step++;buildSteps();showStep(step);updProg();}}
function goBack(){if(step>0){step--;buildSteps();showStep(step);updProg();}}
function showStep(i){document.querySelectorAll('.pstep').forEach((s,idx)=>s.classList.toggle('active',idx===i));}
function updProg(){const total=aq.length;document.getElementById('prog').style.width=(total>1?(step/(total-1))*100:100)+'%';}

function showReturn(){
  const t=L[lang];
  document.getElementById('steps-wrap').style.display='none';
  const rw=document.getElementById('return-wrap');
  rw.style.display='block';
  rw.innerHTML=`<div class="return-screen">
    <div class="return-icon" style="font-size:56px;color:var(--color-text-secondary);margin-bottom:1rem">&#10003;</div>
    <div class="return-title">${t.returnTitle}</div>
    <div class="return-sub">${t.returnSub}</div>
    <div class="pin-section">
      <div class="pin-label">${t.pinHint}</div>
      <div class="pin-input">
        <input class="pin-digit" type="password" maxlength="4" id="pin-field" oninput="checkPin(this.value)" placeholder="••••"/>
      </div>
      <div class="pin-err" id="pin-err"></div>
    </div>
  </div>`;
}

function checkPin(v){
  if(v.length===4){
    if(v===PIN){showResult();}
    else{
      document.getElementById('pin-err').textContent=L[lang].pinErr;
      document.getElementById('pin-field').value='';
    }
  }
}

function sci(key){return `<div class="rsci"><div class="rsci-lbl">${L[lang].sciLbl}</div>${SCIENCE[key][lang]}</div>`;}

function showResult(){
  const t=L[lang];
  document.getElementById('return-wrap').style.display='none';
  const rw=document.getElementById('result-wrap');
  rw.style.display='block';rw.classList.add('active');

  const name=(answers.name||'').trim()||'Cliente';
  const probs=answers.corp_problem||[];
  const zones=answers.corp_zone||[];
  const fp=answers.face_problem||[];
  const hasCorp=answers.area==='corporal'||answers.area==='ambos';
  const hasFace=answers.area==='facial'||answers.area==='ambos';
  const hasGrasa=probs.includes('grasa');
  const cavOk=zones.includes('piernas')||zones.includes('brazos');
  const vol=answers.vol_objetivo||1;
  const nCrio=getCrioSessions(vol);
  const crioP=getCrioPrice(nCrio,lang);
  const mn=answers.motiv_necesidad||3,mi=answers.motiv_importancia||3,mu=answers.motiv_urgencia||3;

  const motivHTML=`<div class="motivation-box">
    ${[{k:'necesidad',v:mn,l:t.motiv1},{k:'importancia',v:mi,l:t.motiv2},{k:'urgencia',v:mu,l:t.motiv3}].map(m=>`
      <div style="margin-bottom:0.75rem">
        <div class="motivation-row"><span class="motivation-label">${m.l}</span><span class="motivation-val">${m.v}/5</span></div>
        <div class="motivation-bar"><div class="motivation-fill" style="width:${m.v*20}%"></div></div>
      </div>`).join('')}
  </div>`;

  let packsHTML='',phaseNum=0;

  if(hasCorp&&hasGrasa){
    phaseNum++;
    packsHTML+=`<div class="rcard featured">
      <div class="rbadge">${t.featuredLbl(nCrio)}</div>
      <div class="rname">${lang==='es'?'Criolipólisis CRIOX Avanxel':'Criolipòlisi CRIOX Avanxel'}</div>
      <div class="rinc">
        ${lang==='es'?`Objetivo: perder ${vol} talla${vol>1?'s':''} · ${nCrio} sesiones`:`Objectiu: perdre ${vol} talla${vol>1?'s':''} · ${nCrio} sessions`}
        <br><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
          ${[6,8,10,12].map(n=>`<span class="${n===nCrio?'pill hl':'pill'}">${n} ${lang==='es'?'ses.':'sess.'}</span>`).join('')}
        </div>
        ${cavOk?`<br>${lang==='es'?'+ Cavitación en piernas/brazos':'+ Cavitació a cames/braços'}`:''}
      </div>
      ${sci('criox')}
      <div class="rprice">${crioP.pack}</div>
      <div class="rpricesub">${crioP.detail}</div>
    </div>`;
  }

  if(hasCorp&&(probs.includes('celulitis')||probs.includes('retencion')||hasGrasa)){
    phaseNum++;
    packsHTML+=`<div class="rcard">
      <div class="rbadge">${t.phaseLbl(phaseNum)}</div>
      <div class="rname">${lang==='es'?'Pack Alisado Anticelulítico':'Pack Allisat Anticel·lulític'}</div>
      <div class="rinc">${lang==='es'?'Endomodelaje + Presoterapia + RollAction + Lipoled + Maderoterapia + Vacum':'Endomodelatge + Pressoteràpia + RollAction + Lipoled + Teràpia de fusta + Vacum'}</div>
      ${sci('endo')}
      <div class="rprice">${lang==='es'?'Desde 300 €':'Des de 300 €'}</div>
      <div class="rpricesub">${lang==='es'?'5 sesiones · 60 €/ses. · o 10 ses.: 500 €':'5 sessions · 60 €/sess. · o 10 sess.: 500 €'}</div>
    </div>`;
  }

  if(hasCorp&&(probs.includes('flacidez')||probs.includes('tonificar')||hasGrasa)){
    phaseNum++;
    packsHTML+=`<div class="rcard">
      <div class="rbadge">${t.phaseLbl(phaseNum)}</div>
      <div class="rname">${lang==='es'?'Pack Tonificación · EMS + Radiofrecuencia Corporal':'Pack Tonificació · EMS + Radiofreqüència Corporal'}</div>
      <div class="rinc">${lang==='es'?'EMS Body Sculpt (36.000 contracciones/sesión) + Radiofrecuencia corporal para reafirmar tras la pérdida de volumen':'EMS Body Sculpt (36.000 contraccions/sessió) + Radiofreqüència corporal per reafirmar'}</div>
      ${sci('ems')}
      <div class="rprice">${lang==='es'?'Desde 150 €':'Des de 150 €'}</div>
      <div class="rpricesub">${lang==='es'?'Pack 5 ses. EMS + Radiofrecuencia desde 200 €':'Pack 5 sess. EMS + Radiofreqüència des de 200 €'}</div>
    </div>`;
  }

  if(hasFace){
    if(fp.includes('arrugas')||fp.includes('flacidez_facial')){
      packsHTML+=`<div class="rcard">
        <div class="rbadge">${lang==='es'?'Facial':'Facial'}</div>
        <div class="rname">${lang==='es'?'Radiofrecuencia Facial · Termoabsorción':'Radiofreqüència Facial · Termoabsorció'}</div>
        <div class="rinc">${lang==='es'?'Reafirma el óvalo · Suaviza arrugas · Efecto tensor inmediato · 3+1 de regalo':'Reafirma l\'òval · Suavitza arrugues · Efecte tensor immediat · 3+1 de regal'}</div>
        ${sci('rffac')}<div class="rprice">80 €</div>
        <div class="rpricesub">${lang==='es'?'por sesión · 3+1 de regalo':'per sessió · 3+1 de regal'}</div>

    if(fp.includes('manchas')){

        ${sci('plasma')}<div class="rprice">${lang==='es'?'Precio según zona':'Preu segons zona'}</div>
      </div>`;
    }
    if(fp.includes('luminosidad')||fp.includes('evento')){
      packsHTML+=`<div class="rcard">
        <div class="rbadge">Facial</div>
        <div class="rname">${lang==='es'?'Vitaminas + Lipoled':'Vitamines + Lipoled'}</div>
        <div class="rinc">${lang==='es'?'Luminosidad inmediata · Efecto glow · 3+1 de regalo':'Lluminositat immediata · Efecte glow · 3+1 de regal'}</div>
        ${sci('lipoled')}<div class="rprice">${lang==='es'?'Desde 65 €':'Des de 65 €'}</div>
        <div class="rpricesub">${lang==='es'?'por sesión · 3+1 de regalo':'per sessió · 3+1 de regal'}</div>
      </div>`;
    }
  }

  chatMsgs=[{role:'bot',text:t.chatWelcome(name)}];

  rw.innerHTML=`
    <div class="rh">
      <div class="rh-title">${t.resultTitle(name)}</div>
      <div class="rh-sub">${t.resultSub}</div>
    </div>
    <div class="rsect">${t.yourData}</div>
    <div class="rcard" style="margin-bottom:1.5rem">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
        <div><span style="color:var(--color-text-secondary)">${lang==='es'?'Nombre':'Nom'}: </span><span style="font-weight:500">${name}</span></div>

        <div><span style="color:var(--color-text-secondary)">${lang==='es'?'Zona':'Zona'}: </span><span style="font-weight:500">${(zones.join(', '))||'-'}</span></div>
        ${hasGrasa?`<div><span style="color:var(--color-text-secondary)">${lang==='es'?'Objetivo':'Objectiu'}: </span><span style="font-weight:500">${vol} ${t.volUnit} · ${nCrio} ${lang==='es'?'ses.':'sess.'} crio</span></div>`:''}

        <div class="chat-sub">${t.chatSub}</div>
      </div>

        <button class="chat-send" onclick="sendChat()">${t.chatSend}</button>
      </div>
    </div>
    <button class="pbtn" style="margin-top:1.5rem;display:block;width:100%" onclick="restartTest()">${t.restart}</button>`;
}

function renderMsgs(){
  return chatMsgs.map(m=>`<div class="chat-msg ${m.role}">${m.text}</div>`).join('');
}

function addMsg(role,text){
  chatMsgs.push({role,text});
  const c=document.getElementById('chat-msgs');
  if(c){c.innerHTML=renderMsgs();c.scrollTop=c.scrollHeight;}
}

async function sendChat(){
  const inp=document.getElementById('chat-inp');
  if(!inp||!inp.value.trim())return;
  const userMsg=inp.value.trim();
  inp.value='';
  addMsg('user',userMsg);

  const c=document.getElementById('chat-msgs');
  const typing=document.createElement('div');
  typing.className='typing';typing.id='typing-ind';
  typing.innerHTML='<span></span><span></span><span></span>';
  if(c){c.appendChild(typing);c.scrollTop=c.scrollHeight;}

  const name=(answers.name||'').trim();
  const probs=(answers.corp_problem||[]).join(', ');
  const zones=(answers.corp_zone||[]).join(', ');
  const vol=answers.vol_objetivo||1;

  const systemPrompt=lang==='es'
    ?`Eres un asesor nutricional especializado del centro de estética Pellbella. Tu rol es dar consejos de alimentación que complementen los tratamientos estéticos del centro. El cliente se llama ${name}. Sus problemas son: ${probs}. Zonas a tratar: ${zones}. Objetivo: perder ${vol} tallas. Da consejos breves, prácticos y motivadores. Máximo 3-4 frases. En español.`
    :`Ets un assessor nutricional especialitzat del centre d'estètica Pellbella. El teu rol és donar consells d'alimentació que complementin els tractaments estètics. El client es diu ${name}. Els seus problemes són: ${probs}. Zones a tractar: ${zones}. Objectiu: perdre ${vol} talles. Dona consells breus, pràctics i motivadors. Màxim 3-4 frases. En català.`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:systemPrompt,
        messages:[
          ...chatMsgs.filter(m=>m.role!=='bot'||chatMsgs.indexOf(m)>0).map(m=>({role:m.role==='bot'?'assistant':'user',content:m.text})),
          {role:'user',content:userMsg}
        ]
      })
    });
    const data=await res.json();
    const typingEl=document.getElementById('typing-ind');if(typingEl)typingEl.remove();
    const reply=data.content&&data.content[0]?data.content[0].text:'...';
    addMsg('bot',reply);
  }catch(e){
    const typingEl=document.getElementById('typing-ind');if(typingEl)typingEl.remove();
    addMsg('bot',lang==='es'?'Lo siento, no puedo responder ahora. Consulta con el equipo de Pellbella.':'Ho sento, no puc respondre ara. Consulta amb l\'equip de Pellbella.');
  }
}

function restartTest(){
  answers={vol_objetivo:1,motiv_necesidad:3,motiv_importancia:3,motiv_urgencia:3};
  step=0;chatMsgs=[];
  document.getElementById('return-wrap').style.display='none';
  document.getElementById('result-wrap').classList.remove('active');
  document.getElementById('result-wrap').style.display='none';
  document.getElementById('steps-wrap').style.display='block';
  render();
}

function render(){aq=getAQ();buildSteps();showStep(step);updProg();}
try{render();}catch(err){
  document.getElementById('steps-wrap').innerHTML='<div style="padding:2rem;text-align:center;font-size:14px;color:var(--color-text-secondary)">Error al cargar. Recarga la página.</div>';
  console.error('Pellbella render error:',err);
}
</script>
